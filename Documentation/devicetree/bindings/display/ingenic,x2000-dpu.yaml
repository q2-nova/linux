%YAML 1.2
---
$id: http://devicetree.org/schemas/display/ingenic,x2000-dpu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Ingenic X2000 display processing unit
maintainers:
  - linux-mips@vger.kernel.org
properties:
  compatible:
    const: ingenic,x2000-dpu
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  clocks:
    maxItems: 1
  clock-names:
    const: lcd
  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: Pixel output to the DSI host.
required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - port
additionalProperties: false
