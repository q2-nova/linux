%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/shanling,q2-h0209s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Shanling Q2 H0209S 320x375 DSI panel
maintainers:
  - linux-mips@vger.kernel.org
allOf:
  - $ref: panel-common.yaml#
properties:
  compatible:
    const: shanling,q2-h0209s
  reg:
    maxItems: 1
  backlight: true
  port: true
  reset-gpios:
    maxItems: 1
  vdd28-supply:
    description: 2.8 V panel supply (Q2 AXP2101 ALDO2).
  vdd33-supply:
    description: 3.3 V panel supply (Q2 AXP2101 ALDO4).
required:
  - compatible
  - reg
  - backlight
  - port
  - reset-gpios
  - vdd28-supply
  - vdd33-supply
additionalProperties: false
